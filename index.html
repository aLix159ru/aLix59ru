<html lang="ru">
<head>

    <!-- Шрифты Google -->

    <style>
        :root {
            --bg-color: #090a0f;
            --card-bg: rgba(20, 22, 31, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.4);
            --cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.14), transparent 35%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12), transparent 35%);
            background-attachment: fixed;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            border-color: rgba(124, 58, 237, 0.3);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        /* Шапка профиля */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 0 25px var(--accent-glow);
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        /* Если захочешь поставить картинку на аватарку, раскомментируй <img> в HTML */
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info h1 {
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .surname-badge {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.07);
            padding: 3px 10px;
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 400;
            font-family: 'JetBrains Mono', monospace;
        }

        .meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .meta-tag {
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 7px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'JetBrains Mono', monospace;
        }

        .meta-tag i {
            color: var(--accent);
        }

        /* Баннер Цири ВПН */
        .project-banner {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(6, 182, 212, 0.15));
            border: 1px solid rgba(124, 58, 237, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
        }

        .project-banner:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.25);
            border-color: var(--accent);
        }

        .project-info h3 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .project-info p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .btn-arrow {
            background: var(--accent);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .project-banner:hover .btn-arrow {
            transform: translateX(4px);
        }

        /* Заголовки секций */
        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .section-title i {
            color: var(--cyan);
        }

        /* Хобби и Девайсы */
        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.09);
            transform: translateY(-2px);
        }

        .chip i {
            color: var(--text-muted);
        }

        .chip.dream {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(239, 68, 68, 0.12));
            border-color: rgba(245, 158, 11, 0.35);
            color: #fcd34d;
        }

        .chip.dream i {
            color: #f59e0b;
        }

        /* Сетка ссылок */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
